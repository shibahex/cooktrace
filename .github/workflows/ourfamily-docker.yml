# ourfamily fork: publish this fork's image to GitHub's registry.
#
#   push to ourfamily-feats → ghcr.io/<owner>/cooktrace:ourfamily
#
# Separate from upstream's docker.yml (which pushes to traceapps' own
# registries and needs their Docker Hub login), so upstream merges never
# conflict with it. Needs no secrets: GITHUB_TOKEN can write packages.
name: Build & Push (ourfamily)

on:
  push:
    branches: [ ourfamily-feats ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ARM64 too, for a Raspberry Pi or ARM server.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry names must be lowercase.
      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cooktrace" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.img.outputs.name }}:ourfamily
            ${{ steps.img.outputs.name }}:ourfamily-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
